{% extends 'base.html' %}

{% block intro %}
  <a href="https://jquery.com/">jQuery</a> is a popular library that
  adds cross browser APIs for common tasks. However, it requires loading
  an extra library.
{% endblock %}

{% block script %}
  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script>
    function addSubmit(ev) {
      ev.preventDefault();
      $.ajax({
        method: 'POST',
        url: {{ url_for('add')|tojson }},
        data: $(this).serialize()
      }).done(addShow).fail(addError);
    }

    function addShow(data) {
      showResult(data.result);
    }

    function addError(jqXHR) {
      // jQuery parses a JSON error body into responseJSON. Fall back to a
      // generic message when the server could not be reached at all.
      var data = jqXHR.responseJSON;

      if (data && data.error) {
        showError(data.error);
      } else {
        showError('Could not reach the server. Please try again.');
      }
    }

    function showResult(value) {
      $('#result').text(value);
      $('#error').text('');
    }

    function showError(message) {
      $('#result').text('');
      $('#error').text(message);
    }

    $('#calc').on('submit', addSubmit);
  </script>
{% endblock %}
