{% extends 'base.html' %}

{% block intro %}
  <a href="https://developer.mozilla.org/en-US/docs/Web/API/WindowOrWorkerGlobalScope/fetch"><code>fetch</code></a>
  is the <em>modern</em> plain JavaScript way to make requests. It's
  supported in all modern browsers.
{% endblock %}

{% block script %}
  <script>
    function addSubmit(ev) {
      ev.preventDefault();
      fetch({{ url_for('add')|tojson }}, {
        method: 'POST',
        body: new FormData(this)
      })
        .then(function (response) {
          // Read the body whether the request succeeded or failed, so the
          // error message the server sent can be shown to the user.
          return response.json().then(function (data) {
            addShow(response.ok, data);
          });
        })
        .catch(function () {
          showError('Could not reach the server. Please try again.');
        });
    }

    function addShow(ok, data) {
      if (ok) {
        showResult(data.result);
      } else {
        showError(data.error);
      }
    }

    function showResult(value) {
      document.getElementById('result').innerText = value;
      document.getElementById('error').innerText = '';
    }

    function showError(message) {
      document.getElementById('result').innerText = '';
      document.getElementById('error').innerText = message;
    }

    var form = document.getElementById('calc');
    form.addEventListener('submit', addSubmit);
  </script>
{% endblock %}
